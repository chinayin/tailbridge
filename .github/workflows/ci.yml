name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: Run full network and systemd E2E
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL --retry 3 "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" -o "${RUNNER_TEMP}/shellcheck.tar.xz"
          printf '%s  %s\n' '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198' "${RUNNER_TEMP}/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "${RUNNER_TEMP}/shellcheck.tar.xz" -C "${RUNNER_TEMP}"
          sudo install -m 755 "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
          make setup
      - name: Lint
        run: make lint
      - name: Offline tests
        run: make test

  e2e:
    name: Network and systemd E2E
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: make setup
      - name: Install and register test devices
        run: make e2e-bootstrap
      - name: Start optional management UI
        run: make e2e-ui
      - name: Full network E2E
        run: make e2e-test
      - name: Systemd E2E
        run: make e2e-systemd
      - name: Diagnose failed services
        if: failure()
        run: local/.venv/bin/python tests/e2e/e2e.py compose logs --no-color --tail 100
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            local/e2e/generated/install-results.json
            local/e2e/generated/results.json
            local/e2e/generated/results.html
          if-no-files-found: warn
          retention-days: 7
      - name: Stop test environment
        if: always()
        run: make e2e-down
